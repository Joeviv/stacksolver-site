version: 1
frontend:
  phases:
    preBuild:
      commands:
        - nvm install 24
        - nvm use 24
        - npm install -g pnpm@9
        - pnpm config set store-dir .pnpm-store
        - pnpm install --frozen-lockfile
        - pnpm audit --audit-level=high || true
    build:
      commands:
        - pnpm run build
        - |
          cat > dist/deploy-manifest.json <<'JSON'
          {
            "version": 1,
            "routes": [
              { "path": "/*", "target": { "kind": "Static" } }
            ],
            "framework": { "name": "astro", "version": "6.1.4" }
          }
          JSON
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
