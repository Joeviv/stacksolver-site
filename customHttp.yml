# Cabeceras HTTP de seguridad — las sirve AWS Amplify en cada respuesta.
#
# ⛔ Amplify lee ESTE archivo. NO lee `_headers` (eso es Netlify / Cloudflare Pages).
#    Verificar SIEMPRE por el receptor, no por el repo:
#      curl -sI https://www.stacksolver.tech | grep -iE 'strict-transport|content-security|x-frame'
#
# Notas de diseño (2026-08-06):
#  - HSTS sin `includeSubDomains` y sin `preload` a propósito: `academy.stacksolver.tech`
#    no responde por HTTPS, y como Amplify sirve también el ápex, `includeSubDomains`
#    lo dejaría inaccesible. `preload` es irreversible en la práctica.
#  - El CSP va en Report-Only: el navegador reporta las violaciones en consola pero NO
#    bloquea nada. Se observa en producción y sólo entonces se pasa a vinculante
#    renombrando la clave a `Content-Security-Policy`.
#  - Permissions-Policy deniega lo sensible pero permite a los reproductores lo que
#    necesitan: los vídeos usan autoplay, así que bloquearlo a secas los rompería.

customHeaders:
  - pattern: '**'
    headers:
      - key: 'Strict-Transport-Security'
        value: 'max-age=31536000'
      - key: 'X-Content-Type-Options'
        value: 'nosniff'
      - key: 'X-Frame-Options'
        value: 'SAMEORIGIN'
      - key: 'Referrer-Policy'
        value: 'strict-origin-when-cross-origin'
      - key: 'Cross-Origin-Opener-Policy'
        value: 'same-origin'
      - key: 'Permissions-Policy'
        value: 'accelerometer=(), camera=(), display-capture=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), midi=(), payment=(), usb=(), interest-cohort=(), autoplay=(self "https://player.vimeo.com" "https://www.youtube.com"), fullscreen=(self "https://player.vimeo.com" "https://www.youtube.com")'
      # Inventario de terceros medido el 2026-08-06 sobre src/ y public/:
      #   frame-src   player.vimeo.com (VideoEmbed/VideoLightbox + páginas de servicio)
      #               www.youtube.com  (4 iframes en public/camar4com3rciocasanar3/)
      #   img-src     vumbnail.com     (miniaturas de Vimeo en VideoLightbox)
      #   connect-src formspree.io     (fetch del formulario de contacto)
      #   font-src    'self' data: — las fuentes son autohospedadas desde el PR #34, pero el
      #               bundler las EMBEBE como `url(data:font/woff2;base64,…)` en el CSS.
      #               Medido en produccion el 2026-08-10 con el CSP ya en Report-Only: sin
      #               `data:` el navegador reportaba violacion en cada @font-face y, de haber
      #               sido vinculante, la portada se habria quedado sin tipografia.
      - key: 'Content-Security-Policy-Report-Only'
        value: "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://vumbnail.com; font-src 'self' data:; connect-src 'self' https://formspree.io; frame-src https://player.vimeo.com https://www.youtube.com; form-action 'self' https://formspree.io"
